# v8 재작성 변경 요약 (2026-11-21, 감사 보고서 action-code-audit-2026-11-21.md 기반)
# - [신규] concurrency guard 추가 (§3-5): 스케줄 실행과 수동 실행이 겹쳐 같은
#   posted JSON을 두고 충돌하는 것을 방지. cancel-in-progress: false라 실행 중
#   런은 끝까지 가고, 다음 런은 대기한다.
# - [수정] python -u 실행 (§4-9): 출력 버퍼링 때문에 Actions 로그 타임스탬프가
#   뭉개지는 문제 방지.
# - [유지] 스케줄 06:00 KST (cron '0 21 * * *'), workflow_dispatch 입력
#   (post_status/force_update/gemini_model), 최소 권한 contents: write.
name: pronews.jp 자동 번역 및 게시 v8

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 KST 06:00 (UTC 21:00)

  workflow_dispatch:
    inputs:
      post_status:
        description: '게시 상태'
        required: false
        default: 'draft'
        type: choice
        options:
          - draft
          - publish
      force_update:
        description: '이미 게시된 기사도 재처리 (true/false)'
        required: false
        default: 'false'
      gemini_model:
        description: 'Gemini 모델 (기본: gemini-2.5-flash-lite)'
        required: false
        default: 'gemini-2.5-flash-lite'
      event_name_override:
        description: '스케줄 경로 테스트용: schedule 입력 시 스케줄 경로(RSS + 최신 보충)로 실행 (기본: 실제 이벤트)'
        required: false
        default: ''
      cleanup_test_drafts:
        description: '테스트 draft 정리만 수행 (true/false)'
        required: false
        default: 'false'

# 동시 실행 방지 (§3-5): 같은 그룹의 런은 직렬로만 실행
concurrency:
  group: prodg-translate
  cancel-in-progress: false

jobs:
  translate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Python 스크립트에서 git push를 하기 위해 필수

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 의존성 설치
      run: pip install -r requirements.txt

    - name: 번역 및 게시 실행
      env:
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        POST_STATUS: ${{ github.event.inputs.post_status || 'publish' }}
        FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-2.5-flash-lite' }}
        # #10(a): 스케줄 경로를 브랜치에서 미리 시험할 때 사용.
        # GITHUB_EVENT_NAME은 기본 변수라 덮어쓰기가 무시되므로, 그대로 두고
        # 별도 변수로 전달한다. (재검수 1번)
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        RUN_MODE_OVERRIDE: ${{ github.event.inputs.event_name_override || '' }}
        # B-3(c): true면 테스트 draft 정리만 수행하고 종료한다.
        CLEANUP_TEST_DRAFTS: ${{ github.event.inputs.cleanup_test_drafts || 'false' }}
      run: python -u translate_and_post.py

    - name: 완료 알림
      if: always()
      run: |
        echo "완료: $(date)"
        echo "모드: ${{ github.event_name }}"
        echo "다음 자동 실행: 내일 오전 6시 (KST)"
